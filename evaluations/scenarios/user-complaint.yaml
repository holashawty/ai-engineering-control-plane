# User-complaint workflow eval scenarios

- id: user-complaint-happy-path
  workflow: user-complaint
  tier: workflow
  description: "Happy path: full user-complaint workflow from intake to terminal state"
  steps:
    - action: advance
      on: intent_classified
    - action: emitEvidence
      kind: incident
      data:
        id: incident-eval-uc-1
        observed_at: "2026-08-15T10:00:00Z"
        environment_fingerprint_ref: env-fp-eval-uc-1
        expected_ref: expected-eval-uc-reporter-1
        actual_ref: actual-eval-uc-1
        severity: medium
        status: open
    - action: advance
      on: class_known
    - action: emitEvidence
      kind: trace
      data:
        id: trace-eval-uc-complaint-1
        started_at: "2026-08-15T10:00:30Z"
        event_refs:
          - event-eval-uc-complaint-text
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-uc-complaint-text
        trace_ref: trace-eval-uc-complaint-1
        ts: "2026-08-15T10:00:31Z"
        kind: observation
        source: "ticket:#42"
        payload:
          finding: "reporter: 'login page returns 500 on form submit'"
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-uc-reporter-1
        source_ref: "reporter-stated expectation"
        predicate: "POST /login returns 200 on valid credentials"
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-uc-documented-1
        source_ref: "specs/spec.md#login-endpoint"
        predicate: "POST /login returns 200 on valid credentials; 401 on invalid"
    - action: advance
      on: complaint_understood
    - action: emitEvidence
      kind: trace
      data:
        id: trace-eval-uc-investigate-1
        started_at: "2026-08-15T10:01:00Z"
        event_refs:
          - event-eval-uc-error-log
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-uc-error-log
        trace_ref: trace-eval-uc-investigate-1
        ts: "2026-08-15T10:01:05Z"
        kind: log_line
        source: "app.log"
        payload:
          finding: "Traceback: KeyError 'csrf_token' at /login POST handler"
    - action: advance
      on: evidence_located
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-uc-diagnose-1
        trace_ref: trace-eval-uc-investigate-1
        what: "root_cause_candidate:missing_csrf_token_handling"
        why: "POST handler assumes csrf_token is always present; reporter's session had it stripped"
        validated: false
        root_cause: true
        result: pending
    - action: emitEvidence
      kind: actual
      data:
        id: actual-eval-uc-1
        expected_ref: expected-eval-uc-documented-1
        observed_value: "500 KeyError when csrf_token missing"
        observation_ref: event-eval-uc-error-log
    - action: emitEvidence
      kind: validation
      data:
        id: validation-eval-uc-diagnose-1
        expected_ref: expected-eval-uc-documented-1
        actual_ref: actual-eval-uc-1
        result: mismatch
        method: contract_validation
    - action: advance
      on: root_cause_found
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-uc-propose-1
        trace_ref: trace-eval-uc-investigate-1
        what: "ai_proposal:guard_csrf_token"
        why: "minimal fix — guard for missing csrf_token, return 400"
        validated: false
        result: pending
    - action: advance
      on: fix_approved
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-uc-apply-fix-1
        trace_ref: trace-eval-uc-investigate-1
        ts: "2026-08-15T10:02:00Z"
        kind: file_change
        source: "src/api/login.py"
        payload:
          change: "added guard for missing csrf_token"
    - action: advance
      on: fix_applied
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-uc-verify-1
        source_ref: "specs/spec.md#login-endpoint"
        predicate: "POST /login returns 400 when csrf_token missing, 200 on valid credentials"
    - action: emitEvidence
      kind: actual
      data:
        id: actual-eval-uc-verify-1
        expected_ref: expected-eval-uc-verify-1
        observed_value: "POST /login returns 400 when csrf_token missing"
        observation_ref: event-eval-uc-apply-fix-1
    - action: emitEvidence
      kind: validation
      data:
        id: validation-eval-uc-verify-1
        expected_ref: expected-eval-uc-verify-1
        actual_ref: actual-eval-uc-verify-1
        result: match
        method: app_validation
    - action: advance
      on: behavior_verified
    - action: writeMemory
      type: known-failure
      data:
        id: mem-known-failure-eval-uc-1
        type: known-failure
        schema_version: "1.0.0"
        created_at: "2026-08-15T10:03:00Z"
        source: eval-user-complaint-run-1
        incident_ref: incident-eval-uc-1
        symptom: "POST /login returns 500 when csrf_token missing"
        root_cause: "missing csrf_token guard"
        fix: "added guard returning 400 when csrf_token absent"
    - action: advance
      on: regression_added
  expected:
    terminal_state: report
    is_terminal: true
    max_questions: 0
    no_errors: true
    min_log_entries: 5
