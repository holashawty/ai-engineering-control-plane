# Change-request workflow eval scenarios

- id: change-request-happy-path
  workflow: change-request
  tier: workflow
  description: "Happy path: full change-request workflow from intake to terminal state"
  steps:
    - action: advance
      on: intent_classified
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-cr-classify-1
        trace_ref: trace-eval-cr-1
        what: "acceptance:proceed"
        why: "behavior-change request — replace OLD behavior with NEW"
        validated: true
        result: accepted
    - action: emitEvidence
      kind: trace
      data:
        id: trace-eval-cr-1
        started_at: "2026-08-15T10:00:00Z"
        event_refs: []
    - action: advance
      on: class_known
    - action: emitEvidence
      kind: trace
      data:
        id: trace-eval-cr-current-1
        started_at: "2026-08-15T10:00:30Z"
        event_refs:
          - event-eval-cr-current-behavior
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-cr-current-behavior
        trace_ref: trace-eval-cr-current-1
        ts: "2026-08-15T10:00:35Z"
        kind: test_result
        source: "pytest"
        payload:
          finding: "current behavior: reset email comes from support@"
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-cr-old-1
        source_ref: "specs/spec.md#password-reset-from-support"
        predicate: "OLD: reset email sender is support@"
    - action: advance
      on: current_behavior_mapped
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-cr-design-1
        trace_ref: trace-eval-cr-current-1
        what: "design:change_sender_to_noreply"
        why: "switch reset email sender from support@ to noreply@"
        validated: false
        result: pending
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-cr-new-1
        source_ref: "specs/spec.md#password-reset-from-noreply"
        predicate: "NEW: reset email sender is noreply@"
    - action: advance
      on: change_design_approved
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-cr-migrate-1
        trace_ref: trace-eval-cr-current-1
        what: "ai_proposal:apply_patch"
        why: "update sender config from support@ to noreply@"
        validated: false
        result: pending
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-cr-file-change-1
        trace_ref: trace-eval-cr-current-1
        ts: "2026-08-15T10:01:30Z"
        kind: file_change
        source: "config/email.py"
        payload:
          before: "support@"
          after: "noreply@"
    - action: advance
      on: migration_complete
    - action: emitEvidence
      kind: actual
      data:
        id: actual-eval-cr-verify-1
        expected_ref: expected-eval-cr-new-1
        observed_value: "reset email sender is noreply@"
        observation_ref: event-eval-cr-file-change-1
    - action: emitEvidence
      kind: validation
      data:
        id: validation-eval-cr-verify-1
        expected_ref: expected-eval-cr-new-1
        actual_ref: actual-eval-cr-verify-1
        result: match
        method: app_validation
    - action: advance
      on: behavior_verified
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-cr-doc-change-1
        trace_ref: trace-eval-cr-current-1
        ts: "2026-08-15T10:02:30Z"
        kind: file_change
        source: "docs/api.md"
        payload:
          change: "updated password-reset docs to reflect noreply@ sender"
    - action: advance
      on: documentation_complete
    - action: writeMemory
      type: known-failure
      data:
        id: mem-known-failure-eval-cr-1
        type: known-failure
        schema_version: "1.0.0"
        created_at: "2026-08-15T10:03:00Z"
        source: eval-change-request-run-1
        incident_ref: incident-eval-cr-1
        symptom: "downstream code expecting support@ sender on reset emails"
        root_cause: "OLD behavior shipped support@ as sender"
        fix: "migrate consumers to noreply@ sender; see deprecation note"
    - action: emitEvidence
      kind: incident
      data:
        id: incident-eval-cr-1
        observed_at: "2026-08-15T10:00:00Z"
        environment_fingerprint_ref: env-fp-eval-cr-1
        expected_ref: expected-eval-cr-new-1
        actual_ref: actual-eval-cr-verify-1
        severity: low
        status: closed
  expected:
    terminal_state: report
    is_terminal: true
    max_questions: 0
    no_errors: true
    min_log_entries: 5
