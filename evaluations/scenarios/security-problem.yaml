# Security-problem workflow eval scenarios

- id: security-problem-happy-path
  workflow: security-problem
  tier: workflow
  description: "Happy path: full security-problem workflow from intake to terminal state"
  steps:
    - action: advance
      on: intent_classified
    - action: emitEvidence
      kind: incident
      data:
        id: incident-eval-sp-1
        observed_at: "2026-08-15T10:00:00Z"
        environment_fingerprint_ref: env-fp-eval-sp-1
        expected_ref: expected-eval-sp-1
        actual_ref: actual-eval-sp-1
        severity: high
        status: open
    - action: advance
      on: class_known
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-sp-severity-1
        trace_ref: trace-eval-sp-1
        what: "severity_assessment:CVSS:7.5"
        why: "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N — unauthenticated data exposure"
        validated: true
        result: accepted
    - action: emitEvidence
      kind: trace
      data:
        id: trace-eval-sp-1
        started_at: "2026-08-15T10:00:30Z"
        event_refs: []
    - action: advance
      on: severity_assessed
    - action: emitEvidence
      kind: trace
      data:
        id: trace-eval-sp-investigate-1
        started_at: "2026-08-15T10:01:00Z"
        event_refs:
          - event-eval-sp-exploit
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-sp-exploit
        trace_ref: trace-eval-sp-investigate-1
        ts: "2026-08-15T10:01:05Z"
        kind: observation
        source: "curl /api/users"
        payload:
          finding: "unauthenticated GET /api/users returns full PII dump"
    - action: advance
      on: vulnerability_confirmed
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-sp-diagnose-1
        trace_ref: trace-eval-sp-investigate-1
        what: "root_cause_candidate:missing_auth_check"
        why: "GET /api/users handler does not check Authorization header"
        validated: false
        root_cause: true
        result: pending
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-sp-1
        source_ref: "constitution/safety-rules.md#authz"
        predicate: "PII endpoints require authenticated session"
    - action: emitEvidence
      kind: actual
      data:
        id: actual-eval-sp-1
        expected_ref: expected-eval-sp-1
        observed_value: "GET /api/users returns PII without auth"
        observation_ref: event-eval-sp-exploit
    - action: emitEvidence
      kind: validation
      data:
        id: validation-eval-sp-diagnose-1
        expected_ref: expected-eval-sp-1
        actual_ref: actual-eval-sp-1
        result: mismatch
        method: contract_validation
    - action: advance
      on: root_cause_found
    - action: emitEvidence
      kind: decision
      data:
        id: decision-eval-sp-mitigation-1
        trace_ref: trace-eval-sp-investigate-1
        what: "mitigation:add_auth_check"
        why: "require Authorization header on /api/users"
        validated: false
        result: pending
    - action: advance
      on: mitigation_approved
    - action: emitEvidence
      kind: event
      data:
        id: event-eval-sp-apply-1
        trace_ref: trace-eval-sp-investigate-1
        ts: "2026-08-15T10:02:00Z"
        kind: file_change
        source: "src/api/users.py"
        payload:
          change: "added auth check rejecting unauthenticated requests"
    - action: advance
      on: mitigation_applied
    - action: emitEvidence
      kind: expected
      data:
        id: expected-eval-sp-verify-1
        source_ref: "constitution/safety-rules.md#authz"
        predicate: "GET /api/users returns 401 for unauthenticated, 200 for authenticated"
    - action: emitEvidence
      kind: actual
      data:
        id: actual-eval-sp-verify-1
        expected_ref: expected-eval-sp-verify-1
        observed_value: "GET /api/users returns 401 without auth, 200 with auth"
        observation_ref: event-eval-sp-apply-1
    - action: emitEvidence
      kind: validation
      data:
        id: validation-eval-sp-verify-1
        expected_ref: expected-eval-sp-verify-1
        actual_ref: actual-eval-sp-verify-1
        result: match
        method: app_validation
    - action: advance
      on: mitigation_verified
    - action: writeMemory
      type: known-failure
      data:
        id: mem-known-failure-eval-sp-1
        type: known-failure
        schema_version: "1.0.0"
        created_at: "2026-08-15T10:03:00Z"
        source: eval-security-problem-run-1
        incident_ref: incident-eval-sp-1
        symptom: "GET /api/users returns PII without authentication"
        root_cause: "missing auth check on /api/users handler"
        fix: "added auth check returning 401 for unauthenticated requests"
    - action: advance
      on: regression_added
  expected:
    terminal_state: report
    is_terminal: true
    max_questions: 0
    no_errors: true
    min_log_entries: 5
