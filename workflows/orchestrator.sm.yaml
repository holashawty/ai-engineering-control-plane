workflow: orchestrator
schema_version: "1.0.0"
description: >
  Implements "loop engineering" — the 2026 trend (LangChain, June
  2026) where the agent prompts itself, iterates until done, and
  reports findings — applied to the AIECP workflow catalog. The
  orchestrator takes a user's high-level goal (typically a
  multi-intent request that spans multiple workflows — "fix the
  shipping bug AND add a feature for batch labels," "make the
  release pass AND clean up the test suite afterward") and
  autonomously routes through multiple workflows in a loop until
  the goal is met or blocked. This is structurally distinct from
  every other workflow in the catalog:

    - bug-report, feature-request, refactor, change-request,
      performance-problem, regression, code-review, release,
      incident, security-problem, user-complaint each address ONE
      shape of work (reactive, constructive, behavior-preserving,
      behavior-modifying, cost-shaped, prior-context-aware,
      gatekeeping, release-shaped, alert-shaped, vulnerability-
      shaped, complaint-shaped). They run once and terminate.
    - unknown-failure routes ONE ambiguous request to ONE target
      workflow (or refuses safely). It runs once and terminates,
      producing a routing Decision rather than an applied change.
    - project-onboarding and discovery-refresh run discovery once
      and write/refresh memory. They run once and terminate.

  The orchestrator is the ONLY workflow in the catalog whose
  state graph contains a back-edge from a post-execution state
  (evaluate-result) to a pre-execution state (route). That back-
  edge is the loop: after one workflow completes, the orchestrator
  evaluates whether the original goal is fully met; if not, it
  routes to the NEXT workflow that contributes to the goal and
  loops. This is the "prompt itself, iterate until done" pattern
  — the agent does not return to the user between workflows.

  Distinct from `unknown-failure`: unknown-failure triages a
  SINGLE ambiguous intent into one target workflow (or refuses).
  The orchestrator takes a goal that is too LARGE for any one
  workflow — typically a multi-intent request like "fix this bug
  and add that feature" — and decomposes it into a sequence of
  workflows, executing each one. Where `unknown-failure`'s
  terminal `report` state emits a `workflow_routed:<workflow>`
  Decision (and exits), the orchestrator's `route` state emits
  the same `workflow_routed:<workflow>` Decision but then
  PROCEEDS to execute that workflow (via `execute-workflow`)
  rather than handing it back to the user. The orchestrator's
  `report` state emits a `goal_achieved:<summary>` Decision
  summarizing the FULL chain of executed workflows, not a
  single-workflow routing.

  Safety model: the orchestrator itself does not directly modify
  source code — it spawns other workflows that do. But each
  spawn is gated by the broad-refactor safety gate at
  `execute-workflow`, because the orchestrator is about to
  execute another workflow that may modify code (bug-report's
  apply-fix, feature-request's implement, refactor's implement,
  change-request's migrate). The gate is the same
  broad-refactor → edit_source mapping used by bug-report at
  propose-fix, feature-request at implement, refactor at
  implement, and change-request at migrate — proving the gate is
  workflow-agnostic. Here it gates an INTER-workflow boundary
  rather than an INTRA-workflow transition: the orchestrator is
  the only workflow in the catalog whose safety gate fires on a
  transition whose purpose is to delegate to another workflow,
  not to apply a code change in the current workflow.

  Question economy: budget is 1 (not 2 like unknown-failure's,
  not 0 like code-review's). The one allowed question is in
  `classify-goal` — the only state where a question is decision-
  changing. After `classify-goal`, the orchestrator operates
  autonomously: it does NOT ask the user between workflow
  executions (the whole point of "loop engineering" is that the
  agent prompts ITSELF, not the user, between iterations). If
  the orchestrator cannot determine whether the goal is met
  after a workflow completes, it transitions to `blocked` with
  a precise gap, not to a fourth question.

states:
  - intake
  - classify-goal
  - fast-path
  - route
  - execute-workflow
  - execute-workflow-critical
  - evaluate-result
  - quality-gate
  - report
  - blocked

initial_state: intake
terminal_states: [report, blocked]

transitions:
  - { from: intake, to: classify-goal, on: intent_classified }
  # ADR-0034/0035 wiring: classify-goal now emits a risk_classified:<level>
  # Decision. If risk is trivial, transition to fast-path (skip full FSM).
  # If risk is critical, the execute-workflow state's safety_gate becomes
  # human-approval-required (cannot be auto-confirmed; see run.ts).
  - { from: classify-goal, to: route, on: goal_classified }
  - { from: classify-goal, to: fast-path, on: risk_trivial }
  - { from: classify-goal, to: blocked, on: goal_too_ambiguous }
  # Fast-path: apply directly + verify + report (skip route/execute/evaluate loop)
  - { from: fast-path, to: report, on: fast_path_complete }
  - { from: fast-path, to: blocked, on: fast_path_failed }
  - { from: route, to: execute-workflow, on: workflow_selected }
  - { from: route, to: execute-workflow-critical, on: workflow_selected_critical }
  - { from: route, to: blocked, on: no_workflow_matches }
  - { from: execute-workflow, to: evaluate-result, on: workflow_complete }
  - { from: execute-workflow, to: blocked, on: workflow_failed }
  - { from: execute-workflow-critical, to: evaluate-result, on: workflow_complete }
  - { from: execute-workflow-critical, to: blocked, on: workflow_failed }
  # LOOP BACK EDGE — the structural feature that makes this
  # workflow distinct from every other in the catalog. After a
  # workflow completes and its result is evaluated, if the
  # original goal is not yet met, the orchestrator routes to the
  # NEXT workflow that contributes to the goal. This is "loop
  # engineering": the agent prompts ITSELF to select and execute
  # the next workflow, rather than returning to the user between
  # workflows. The back-edge is bounded by the goal-decomposition
  # produced in classify-goal (a finite list of sub-goals), so
  # the loop cannot run forever — each pass through `route`
  # either selects a workflow that contributes to a remaining
  # sub-goal, or transitions to `report` (goal achieved) or
  # `blocked` (goal unachievable with the available workflows).
  - { from: evaluate-result, to: route, on: goal_not_yet_met }
  # ADR-0037/0038: In creation mode, goal_achieved does NOT go directly
  # to report. It goes through quality-gate first — a BLOCKING gate that
  # requires evidence from product-vision + creative-expansion + self-red-team.
  # This is structural, not advisory: the transition to report REQUIRES
  # quality_gate_passed, just like broad-refactor requires aiecp:confirm.
  # In fix mode, quality-gate is a pass-through (goal_achieved → quality-gate
  # → quality_gate_passed → report, no enrichment needed).
  - { from: evaluate-result, to: quality-gate, on: goal_achieved }
  - { from: evaluate-result, to: blocked, on: goal_unachievable }
  # QUALITY GATE — creation mode's enrichment + red-team loop.
  # quality_gate_passed → report (all enrichment done, no critical gaps)
  # quality_gate_failed → classify-goal (go back, enrich the decomposition)
  - { from: quality-gate, to: report, on: quality_gate_passed }
  - { from: quality-gate, to: classify-goal, on: quality_gate_failed }
  # PLAN REVISION BACK EDGE — when the just-executed workflow
  # emitted a Decision with `what: "architecture_constraint_
  # conflict"` (the architecture-design skill's conflict
  # signal, encoding the logical conflicts_with_requirements:
  # true intent), the orchestrator routes back to `route` on
  # `plan_revision_needed` so that `project-planning` can revise
  # `specs/plan.md` to account for the architectural constraint
  # that conflicted with a requirement. This is the LIVING PLAN
  # feedback loop: planning + architecture are not a waterfall
  # but a co-evolution, and this back-edge is the structural
  # feature that makes them so. See `skills/project-planning/
  # SKILL.md`'s LIVING PLAN rule and `skills/architecture-design/
  # SKILL.md` step 7 for the conflict-detection mechanism.
  - { from: evaluate-result, to: route, on: plan_revision_needed }
  # PLAN REVISION LIMIT — mirrors systematic-debugging's
  # three-failure rule (Phase 4.5 of that skill). After the 3rd
  # `plan_revision_needed` transition without producing a plan
  # that architecture-design can accept without conflict, the
  # orchestrator transitions to `blocked` rather than emit a
  # 4th revised plan. Three rejected architectural candidates is
  # the empirical signal that the problem is structural (the
  # requirements are internally contradictory, or the
  # architectural constraints are mutually exclusive), not
  # local. Continuing past 3 is the failure mode this transition
  # exists to prevent, exactly as systematic-debugging's three-
  # failure rule prevents a 4th speculative fix layered on top
  # of 3 already-failed ones.
  - { from: evaluate-result, to: blocked, on: plan_revision_limit_reached }

state_detail:
  intake:
    purpose: >
      Capture the user's high-level goal verbatim. Do not ask
      clarifying questions here — the one allowed question belongs
      to `classify-goal` (per `question_economy` below). The most
      important classification made here is structural: is this
      request actually a multi-workflow goal (in which case the
      orchestrator is the correct workflow), or is it a single-
      workflow request that the router should have routed to a
      specific workflow directly? If the latter, the
      orchestrator's `classify-goal` state will detect this and
      emit a `workflow_routed:<single-workflow>` Decision that
      short-circuits to a single `execute-workflow` pass (one
      workflow → one `evaluate-result` → `report`) — the
      orchestrator does not refuse a single-workflow goal, it
      just runs it as the degenerate one-iteration case of the
      loop. The acid test for whether the orchestrator is the
      correct workflow: does the request name more than one
      distinct intent ("fix X AND add Y", "release this AND
      clean up Z", "audit A, B, and C")? If yes, the orchestrator
      decomposes it. If no, the router should have routed to the
      specific workflow directly; classify-goal will surface this
      rather than silently running a single-workflow loop.
    emits_evidence: []
    reads_memory: [project, known-failure]

  classify-goal:
    purpose: >
      Decompose the goal into an ordered list of sub-goals, each
      of which is addressable by ONE workflow from the routing
      table in `workflows/_router.md`. The decomposition is the
      orchestrator's analytical core: a goal like "fix the
      shipping bug and add a feature for batch labels" decomposes
      into [bug-report(shipping), feature-request(batch-labels)];
      a goal like "make the release pass and clean up the test
      suite" decomposes into [release, refactor(test-suite)];
      a goal like "audit the auth path for security and
      performance" decomposes into [security-problem(auth),
      performance-problem(auth)]. Emit a `Decision` recording the
      decomposition: `what:
      "goal_decomposition:<sub-goal-1>;<sub-goal-2>;..."`,
      `validated: false` (the decomposition is a plan, not a
      verified outcome — it is `accepted` only when every sub-
      goal's workflow terminates in `report`, which `evaluate-
      result` confirms), `result: "pending"`, `alternatives`
      naming any sub-goal-ordering alternatives considered (e.g.,
      "fix bug before adding feature" vs. "add feature first,
      then fix bug" — the ordering may matter when one workflow's
      output is another's input). The `evidence_refs` array
      points at the inspection events that informed the
      decomposition (recent commits, prior known-failures, the
      Project Intelligence document). May ask at most ONE
      necessary, specific, decision-changing question — typically
      "should the bug be fixed before the feature is added, or
      can they proceed in parallel?" when the decomposition is
      clear but the ordering is not. This is the ONLY allowed
      question in the entire orchestrator run; after `classify-
      goal`, the agent operates autonomously (the "loop" in
      "loop engineering" is the agent prompting ITSELF between
      iterations, not asking the user). If the goal cannot be
      decomposed even after the one allowed question (the request
      is too vague to identify even one workflow that
      contributes), transition to `blocked` with
      `goal_too_ambiguous` and a precise gap naming what
      information would have made the goal decomposable.

      **Project scale detection (mandatory).** In ADDITION to
      the goal decomposition above, `classify-goal` MUST
      determine a `project_scale: small | medium | large`
      classification and emit it as a separate `Decision` with
      `what: "project_scale:small"` (or `:medium` / `:large`),
      `validated: false`, `result: "pending"`. This Decision is
      distinct from the `goal_decomposition:...` Decision — the
      decomposition says WHAT sub-goals to chain; the scale says
      HOW MANY planning phases to insert before the execution
      workflows. The scale classification drives routing as
      follows:

        - **small** — the request is short and single-intent
          (a one-line bug report, a one-line feature tweak).
          Signals: user word count < 20, no `--yarat` flag, no
          multi-platform mention, single existing-repo surface
          named. Routing: SKIP all planning phases; go directly
          to the execution workflow (`bug-report` / `feature-
          request` / `change-request` / `refactor` as the
          decomposition's single sub-goal dictates). No
          `requirements-gathering`, no `project-planning`, no
          `architecture-design`, no `ux-design` — the request is
          self-specifying.
        - **medium** — the request is a substantive feature or
          multi-step change but not a greenfield project.
          Signals: user word count 20-100, no `--yarat` flag, no
          multi-platform mention. Routing: `requirements-
          gathering` → execution workflow (typically
          `feature-request` or `change-request`). SKIP
          `project-planning`, `architecture-design`, and
          `ux-design` — the existing repo's architecture and
          design system already constrain the work, and a
          medium-scale feature does not warrant re-planning them.
        - **large** — the request is a greenfield project, a
          major multi-phase effort, or spans multiple platforms.
          Signals: user word count > 100, OR `--yarat` flag
          present, OR multi-platform mention ("web and mobile",
          "iOS and Android"). Routing: the FULL planning chain —
          `requirements-gathering` → `project-planning` →
          `architecture-design` → `ux-design` → execution
          workflows (`feature-request` for each MVP user story)
          → ... This is the case the four planning skills
          (`skills/requirements-gathering/`, `skills/project-
          planning/`, `skills/architecture-design/`, `skills/ux-
          design/`) exist to serve.

      The scale classification is recorded so that downstream
      `evaluate-result` iterations and the terminal `report`
      state can cite which planning phases were (or were not)
      invoked for this goal. A `large` goal that skipped
      `architecture-design` is a routing bug this Decision makes
      auditable. The scale Decision's `evidence_refs` MUST point
      at the inspection events that informed the classification
      (the word-count probe, the `--yarat` flag check, the
      multi-platform mention scan) — per `tool-use-discipline`
      and constitution §8, the classification is derived from
      inspected signals, not recalled patterns.

      **ADR-0034/0035 wiring — risk classification (mandatory).** In
      ADDITION to the goal decomposition above, `classify-goal` MUST
      call `classifyRisk(signals)` from `executor/src/risk-classifier.ts`
      and emit a `Decision` with `what: "risk_classified:<level>"` where
      `<level>` is one of `trivial | low | medium | high | critical`.
      The signals are constructed from the goal text + git diff stat +
      known-failure memory lookup. Based on the risk level:
        - `trivial` → transition to `fast-path` on `risk_trivial` (skip
          the full FSM; apply directly + verify + report)
        - `low` / `medium` / `high` → transition to `route` on
          `goal_classified` (normal full FSM; `high` adds mandatory
          code-review after)
        - `critical` → transition to `route` on `goal_classified`, but
          the `execute-workflow` state's `human-approval-required` gate
          will fire (cannot be auto-confirmed; see `run.ts`)
      This is the **adaptive routing** layer — trivial work doesn't
      need the full 8-state FSM, critical work needs human sign-off.
    emits_evidence: [decision]
    reads_memory: [project, known-failure, environment]

  fast-path:
    purpose: >
      ADR-0034/0035: The fast-path state — entered when `classifyRisk()`
      returned `trivial` (≤5 LOC, .md/.txt/.json only, no security
      keywords, no known-failure match). The full FSM (route →
      execute-workflow → evaluate-result loop) is SKIPPED.

      The agent applies the change directly, verifies it, and emits a
      `Decision` with `what: "fast_path_applied"` recording what was
      changed + how it was verified. Then transitions to `report` on
      `fast_path_complete` (success) or `blocked` on `fast_path_failed`
      (the change didn't apply cleanly, or verification failed — fall
      back to the full FSM for a proper investigation).

      This state has NO safety_gate — trivial work (≤5 LOC, docs-only)
      does not need the broad-refactor gate. The risk classifier's
      `trivial` classification IS the safety assessment.
    emits_evidence: [decision]
    reads_memory: [project]

  route:
    purpose: >
      Select the next workflow to execute, from the remaining
      sub-goals in the decomposition. Emit a `Decision` naming
      the target workflow in the form
      `workflow_routed:<workflow-name>` (e.g.,
      `workflow_routed:bug-report`), `validated: true`,
      `result: "accepted"`. This is the same `what` form
      `unknown-failure`'s `route-or-block` state emits — but
      where `unknown-failure` then transitions to `report` (hand
      the routing back to the user), the orchestrator transitions
      to `execute-workflow` (proceed to run the workflow). The
      `Decision.evidence_refs` MUST contain (a) the
      `classify-goal` decomposition Decision id (the plan this
      routing is executing against), AND (b) the most recent
      `evaluate-result` Decision id (the result of the prior
      iteration, if any — the FIRST iteration has no prior
      result, so the `evidence_refs` contains only the
      decomposition Decision). A routing Decision with no
      `evidence_refs` is a hollow routing, the same hollow-
      evidence failure mode `evidence-engineering` step 2
      exists to prevent across all workflows. If no workflow
      matches the next sub-goal (the sub-goal names a workflow
      not yet implemented, per `workflows/_router.md`'s Status
      column, OR the sub-goal is genuinely unaddressable by any
      workflow in the catalog), transition to `blocked` with
      `no_workflow_matches` and a precise gap naming which sub-
      goal could not be addressed and what workflow would have
      addressed it (if planned but unimplemented) or that no
      workflow in the catalog addresses this kind of sub-goal
      (if the gap is structural, not just temporal).
    emits_evidence: [decision]

  execute-workflow:
    purpose: >
      Simulate running the workflow selected by `route`. In the
      real system, this state would spawn a child `WorkflowRun`
      of the target workflow (bug-report, feature-request,
      refactor, etc.), pass it the sub-goal extracted from the
      decomposition, wait for it to terminate, and propagate its
      terminal state and emitted evidence into the orchestrator's
      own evidence chain. In the MVP executor (which has no
      cross-workflow spawning yet — see `STATUS.md`), this state
      is exercised by the e2e driver through a script that
      simulates the child workflow's outcome: the driver emits
      the evidence the child would have emitted (a `Decision`
      recording the child's terminal outcome, an `Event`
      recording what the child did, optionally a `Validation` if
      the child workflow was a verification workflow like
      bug-report or refactor) and then advances on
      `workflow_complete` or `workflow_failed`. The
      `safety_gate: broad-refactor` declaration here is the
      key safety property: each spawn of a code-modifying child
      workflow (bug-report's apply-fix, feature-request's
      implement, refactor's implement, change-request's migrate)
      is gated before the spawn proceeds. The orchestrator is
      the ONLY workflow in the catalog whose safety gate fires
      on an INTER-workflow boundary (spawning another workflow)
      rather than on an INTRA-workflow transition (one state
      within a single workflow moving to the next). This is the
      correct place for the gate: the orchestrator's own code
      does not modify source, but it CAUSES other workflows to
      modify source, and "causes" must be gated just as
      "applies" is gated, per `constitution/safety-rules.md`
      ("autonomy is bounded, not implicit" — delegation does
      not escape the bound).

      ADR-0030 / ADR-0035 (Phase 3): when the orchestrator's
      `WorkflowRunOptions.sandbox === true`, the child workflow's
      LLM-emitted commands (execSync/spawnSync shell-outs in skills)
      MUST be routed through `executor/src/sandbox-runner.ts`'s
      `runInSandbox()` — i.e. into a hardened Docker container
      (--read-only --cap-drop=ALL --network=none, /workspace bind-mount).
      The sandbox-runner auto-detects Docker availability and falls
      back to host execution with a LOUD WARNING when Docker is missing
      (development mode only; production deployments MUST install Docker
      and build the aiecp-executor image). NOTE: the actual interception
      of every shell-out site is a Phase 3.5 follow-up — in Phase 3 the
      option is declared and documented, and opt-in callers
      (chat-sandbox adapter, e2e-sandbox driver) honor it.
    emits_evidence: [decision, event]
    safety_gate: broad-refactor (evaluated against constitution/autonomy-policy.schema.json broad_refactor_threshold; capability edit_source per executor/src/run.ts GATE_TO_CAPABILITY map)

  execute-workflow-critical:
    purpose: >
      ADR-0034/0035: Identical to `execute-workflow` but entered when
      `classify-goal` emitted `risk_classified:critical` (security
      keywords present, or known-failure match with >50 LOC). The
      `human-approval-required` gate fires here — `advance()` throws
      `safety-gate-needs-human-approval`, and `advanceWithConfirmation()`
      also throws (confirmation is NOT enough). ONLY
      `advanceWithHumanApproval()` can proceed — representing a real
      human approving out-of-band (e.g., `--user-prompt` on the CLI).

      This is the strongest gate in the AIECP catalog: critical-risk
      work (auth, password, payment, security vulnerabilities) NEVER
      auto-executes. A human must explicitly approve each critical-risk
      workflow spawn.
    emits_evidence: [decision, event]
    safety_gate: human-approval-required (capability human_approval per executor/src/run.ts GATE_TO_CAPABILITY map; default policy deny; only advanceWithHumanApproval() bypasses)

  evaluate-result:
    purpose: >
      Evaluate whether the original goal (from `classify-goal`'s
      decomposition) is fully met after the just-executed
      workflow. Emit a `Decision` recording the evaluation:
      `what: "goal_evaluation:<achieved|not_yet_met|
      unachievable>"`, `validated: false` (the evaluation is
      the orchestrator's self-assessment, not a verified
      outcome — `validated: true` would require an external
      Validation, which is the child workflow's
      responsibility, not the orchestrator's), `result:
      "pending"`. The `evidence_refs` array MUST contain (a)
      the `route` Decision id that selected the just-executed
      workflow (the routing being evaluated), AND (b) the
      `execute-workflow` Decision id (the child workflow's
      outcome being evaluated). The three possible outcomes:

        - `goal_achieved` — ALL sub-goals in the decomposition
          have been addressed by workflows that terminated in
          `report` (not `blocked`). Transition to `report`.
        - `goal_not_yet_met` — at least one sub-goal remains
          unaddressed. Transition BACK to `route` (the LOOP
          BACK EDGE — the structural feature that makes this
          workflow distinct from every other in the catalog).
        - `goal_unachievable` — the just-executed workflow
          terminated in `blocked`, AND the blocked state's
          gap names a sub-goal that cannot be addressed by any
          remaining workflow in the catalog. Transition to
          `blocked`.

      **Plan revision handling (the LIVING PLAN feedback
      loop).** In ADDITION to the three goal-evaluation outcomes
      above, this state MUST check whether the just-executed
      workflow emitted a `Decision` whose `what` field is
      `architecture_constraint_conflict` (the `architecture-
      design` skill's canonical conflict signal, encoding the
      logical `conflicts_with_requirements: true` intent —
      see `skills/architecture-design/SKILL.md` step 7 for why
      this is encoded in the `what` field rather than as a
      separate boolean, due to `decision.schema.json`'s
      `additionalProperties: false`). If such a Decision was
      emitted, transition to `route` with `on:
      plan_revision_needed` INSTEAD OF `goal_not_yet_met` —
      the goal is not "not yet met" in the sense of a remaining
      sub-goal; the goal's PLAN needs revision to account for
      the architectural constraint that conflicted with a
      requirement. `route` will then select `project-planning`
      (re-invoked per its LIVING PLAN rule) to update
      `specs/plan.md`, after which `architecture-design` re-runs
      to confirm the revised plan has no further conflicts.

      **Maximum plan revision loops: 3.** After the 3rd
      `plan_revision_needed` transition, transition to
      `blocked` with `on: plan_revision_limit_reached` INSTEAD
      of routing back to `route` for a 4th revision. This
      mirrors `systematic-debugging`'s three-failure rule
      (Phase 4.5 of that skill): three rejected architectural
      candidates is the empirical signal that the problem is
      structural (the requirements are internally contradictory,
      or the architectural constraints are mutually exclusive),
      not local. The blocked report MUST name (a) the three
      conflicts that triggered the revisions, (b) why each
      revised plan did not resolve the conflict, (c) what the
      user should do next (rephrase the requirements to remove
      the contradiction, or relax one of the conflicting
      constraints, or accept that the goal is unachievable with
      the available stack). Continuing past 3 revisions is the
      failure mode the `plan_revision_limit_reached` transition
      exists to prevent — exactly as `systematic-debugging`'s
      three-failure rule prevents a 4th speculative fix layered
      on top of 3 already-failed ones.

      The back-edge to `route` is bounded by the
      decomposition's finite sub-goal count: each pass through
      `route` consumes one sub-goal (the one whose workflow was
      just executed), so the loop runs at most N+1 times (N
      sub-goals + 1 final evaluation that confirms `goal_achieved`).
      An infinite loop is structurally impossible because
      `route` only selects a workflow for a REMAINING sub-goal,
      and the set of remaining sub-goals strictly decreases per
      iteration. If `route` selects the same workflow twice for
      the same sub-goal (the workflow terminated in `blocked`
      but the sub-goal is still addressable by a different
      workflow), that is allowed — but `evaluate-result` MUST
      cite the prior `blocked` outcome in its `Decision.why`
      when transitioning back to `route` so the loop does not
      silently retry the same workflow forever.
    emits_evidence: [decision]

  quality-gate:
    purpose: >
      ADR-0037/0038: The quality-gate state — entered when
      `evaluate-result` says `goal_achieved`. In **fix mode**, this is
      a pass-through: emit `quality_gate_passed` and proceed to `report`.
      In **creation mode** (--yarat / greenfield), this is a BLOCKING
      gate that requires evidence from THREE enrichment processes before
      transitioning to `report`:


      1. **product-vision** (Product Owner perspective): Did the
         `product-vision` skill run and produce `specs/product-vision.md`?
         Did it research domain standards via web search
         (`recency-verification`)? Does the product include the
         domain-standard features found in that research?

      2. **creative-expansion** (Visual Designer + End-User Advocate
         perspective): Did the `creative-expansion` skill run? Did it
         suggest enrichments (visual feedback, animations, micro-
         interactions, progression systems)? Were those enrichments
         implemented OR explicitly rejected with documented reasons?

      3. **self-red-team** (Competitor/Critic perspective): Did the
         `self-red-team` skill run the minimum tour count (based on
         `project_scale` from `classify-goal`: small=1, medium=2,
         large=3+)? Did each tour produce a `Decision` recording
         findings? Were all critical/high findings addressed?

      If ALL three are satisfied → emit `Decision(what:
      "quality_gate_passed")` → transition to `report`.

      If ANY is missing OR critical gaps remain → emit
      `Decision(what: "quality_gate_failed")` with the specific gap
      → transition back to `classify-goal` to enrich the decomposition
      with the missing sub-goals.

      **Mode detection**: The mode is determined by the original
      `classify-goal` Decomposition Decision. If the decomposition
      includes planning skills (requirements-gathering, project-planning,
      architecture-design, ux-design) → creation mode → full quality
      gate. If the decomposition is only fix/maintenance workflows
      (bug-report, refactor, change-request) → fix mode → pass-through.

      **Minimum tour count** (self-red-team, per ADR-0027 scale):
      - small (1 iteration): 1 red-team tour
      - medium (1-3 iterations): 2 red-team tours
      - large (3+ iterations): 3+ red-team tours

      This state is the structural enforcement of ADR-0037's
      "Mode-Dependent Virtues" — without it, the mode separation is
      advisory and skills will drift back to minimalism.
    emits_evidence: [decision]

  report:
    purpose: >
      Summarize the orchestrator's run: the original goal, the
      decomposition from `classify-goal`, the sequence of
      workflows executed (one per loop iteration), each
      workflow's outcome (terminal `report` or `blocked`), and
      the final goal-achievement status. Emit a final
      `Decision` with `what: "goal_achieved:<summary>"`,
      `validated: true`, `result: "accepted"`, and
      `evidence_refs` pointing at the chain of routing +
      execute-workflow + evaluate-result Decisions across all
      iterations. Must include the Decision Trace
      (docs/architecture.md) — not just "goal achieved" but
      the chain of evidence that justifies the achievement.
      Writes a `project` memory entry recording the orchestrator
      run (the goal, the decomposition, the chain of workflows
      executed) so future runs against the same repo can cite
      the prior decomposition rather than re-deriving it. This
      is structurally distinct from every other workflow's
      memory write: bug-report writes a `known-failure` entry
      about a single incident; project-onboarding writes the
      initial `project`+`environment` entries; the orchestrator
      writes a `project` entry recording a MULTI-WORKFLOW
      execution chain, which is a different shape of memory
      fact (a coordination history, not a single-workflow
      outcome).
    writes_memory: [project]

  blocked:
    purpose: >
      Terminal failure state. Reached when: the goal is too
      ambiguous to decompose even after the one allowed question
      (`classify-goal` — the request names no recognizable
      intent, even after inspection), no workflow matches the
      next sub-goal (`route` — the sub-goal names a workflow
      not yet implemented, OR no workflow in the catalog
      addresses this kind of sub-goal), a child workflow
      failed catastrophically (`execute-workflow` — the child
      WorkflowRun itself crashed rather than terminating in
      `report` or `blocked`, which is an executor-level
      failure distinct from the child's own `blocked`), or
      the goal is unachievable with the available workflows
      (`evaluate-result` — the decomposition's remaining
      sub-goals cannot be addressed by any workflow in the
      catalog, even after the just-executed workflow's `blocked`
      outcome is recorded). Must surface a precise gap, never
      a vague failure, per `docs/portability.md` failure modes.
      The blocked report should name which sub-goal could not
      be addressed, which workflows were considered for it, why
      each was rejected, and what the user should do next
      (rephrase the goal, supply more context, manually invoke
      a specific workflow, or wait for a planned workflow to
      ship). The blocked report is the artifact the user will
      read to decide whether to rephrase or manually intervene
      — it must be actionable, not just a refusal.

skills_required:
  - evidence-engineering  # every routing + evaluate-result Decision must be evidence-anchored, not asserted from memory
  - tool-use-discipline  # ADR-0019 — mandatory before any code-reading or workflow-selection; the decomposition must be derived from inspected signals, not recalled patterns
  - recency-verification  # ADR-0019 — the goal may reference a library version or API behavior that has shifted since onboarding; the decomposition must account for the current state
  - diverse-thinking  # the decomposition may benefit from a different cognitive stance when the goal is large or the ordering is unclear; switches stance after the first decomposition if the alternatives are equally plausible
  # The orchestrator skill itself (skills/orchestrator/SKILL.md)
  # drives the classify-goal, route, execute-workflow, and
  # evaluate-result states. It is the dedicated skill authored
  # alongside this workflow; per the convention (see
  # bug-report.sm.yaml / unknown-failure.sm.yaml), it is not
  # duplicated in skills_required because skills_required names
  # skills whose existence is independent of this workflow.

capabilities_required:
  - filesystem_read   # read repo + memory to decompose the goal and route each sub-goal
  - filesystem_write  # spawn child workflows that modify code (the orchestrator's own writes are only the terminal `project` memory entry, but it CAUSES child workflows to write source)
  - shell_exec         # run context-gathering commands for the decomposition + spawn child workflows
  - test_runner        # child workflows (bug-report's verify, refactor's verify-equivalence, feature-request's test) require this; the orchestrator declares it so child spawns inherit the capability

safety_gates:
  - state: execute-workflow
    gate: broad-refactor
  # ADR-0034/0035 wiring: critical-risk work uses a SEPARATE state with
  # a STRONGER gate. human-approval-required CANNOT be bypassed by
  # advanceWithConfirmation() (aiecp:confirm) — only by
  # advanceWithHumanApproval() (real human out-of-band, e.g. --user-prompt).
  # Route: classify-goal emits risk_classified:critical → route emits
  # workflow_selected_critical → execute-workflow-critical fires this gate.
  - state: execute-workflow-critical
    gate: human-approval-required
  # The orchestrator's own code does not modify source — it
  # spawns child workflows that do. But "causes" is gated just
  # as "applies" is gated, per constitution/safety-rules.md
  # ("autonomy is bounded, not implicit" — delegation does not
  # escape the bound). The gate at execute-workflow is the
  # inter-workflow boundary: each spawn of a code-modifying
  # child workflow is gated before the spawn proceeds. The gate
  # uses the same broad-refactor -> edit_source mapping as
  # bug-report's propose-fix, feature-request's implement,
  # refactor's implement, and change-request's migrate —
  # proving the gate is workflow-agnostic. Here it gates an
  # INTER-workflow boundary rather than an INTRA-workflow
  # transition, which is the orchestrator's UNIQUE safety
  # property: no other workflow in the catalog declares a gate
  # whose purpose is to bound delegation to another workflow.
  # The e2e driver at executor/examples/e2e-orchestrator/drive-
  # run.mjs asserts this by attempting an un-confirmed advance
  # out of execute-workflow (rejected with
  # safety-gate-needs-confirmation), then proceeding via
  # advanceWithConfirmation.

question_economy:
  max_questions: 1
  allowed_states: [classify-goal]
  rule: >
    A question may only be asked in `classify-goal`, and only if
    Project Intelligence + Discovery + Memory + the request text
    genuinely cannot resolve the goal decomposition or the sub-
    goal ordering. See docs/workflow-model.md "Question economy."
    The budget is 1 (not 2 like `unknown-failure`'s, not 0 like
    `code-review`'s) because the orchestrator operates
    autonomously after `classify-goal` — the entire point of
    "loop engineering" (LangChain, June 2026) is that the agent
    prompts ITSELF between iterations, not the user. If the one
    allowed question is insufficient to decompose the goal, the
    correct outcome is `blocked` with `goal_too_ambiguous` and
    a precise gap, not a second question — the user must
    rephrase or supply more context rather than consume an
    unbounded interview. The single legitimate question is
    typically about sub-goal ordering ("should the bug be fixed
    before the feature is added?"), not about the decomposition
    itself (the decomposition should be derivable from
    inspection of the codebase + the request text). Questions
    about implementation details ("should the routing Decision
    include a confidence score?") are never permitted under
    this budget; they are not decision-changing at the workflow
    level.
